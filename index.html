<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>استوديو السيناريو</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--tx:#eceff4;--mut:#8b93a7;--ac:#e8b04b;--bd:#262b36}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f6f5f2;--card:#fff;--tx:#1b1d22;--mut:#666;--ac:#b57d12;--bd:#e2dfd8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Tahoma,sans-serif;line-height:1.7;padding:env(safe-area-inset-top,0px) 14px env(safe-area-inset-bottom,0px)}
main{max-width:820px;margin:auto;padding:16px 0}
h1{font-size:1.4rem;margin:8px 0}
h2{font-size:1.1rem;margin:22px 0 4px;color:var(--ac)}
h3{font-size:1rem;margin:0 0 6px}
label{display:block;margin:12px 0 4px;color:var(--mut);font-size:.9rem}
input,select,textarea{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit}
textarea{min-height:110px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{background:var(--ac);color:#111;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;margin-top:14px;width:100%}
button.ghost{background:transparent;color:var(--ac);border:1px solid var(--ac);width:auto;margin:0 0 8px 8px;padding:8px 12px;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:10px 0}
.shot{border-top:1px dashed var(--bd);margin-top:10px;padding-top:8px;font-size:.92rem}
.tag{display:inline-block;background:var(--bd);border-radius:6px;padding:1px 8px;margin:2px 4px 2px 0;font-size:.8rem;color:var(--mut)}
pre{white-space:pre-wrap;word-break:break-word;direction:ltr;text-align:left;background:var(--bg);border-radius:8px;padding:8px;font-size:.8rem;margin:6px 0 0}
.muted{color:var(--mut);font-size:.88rem}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.stats div{flex:1;min-width:110px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center}
.stats b{display:block;font-size:1.2rem;color:var(--ac)}
</style>
</head>
<body>
<main>
<h1>🎬 استوديو السيناريو</h1>
<p class="muted">أدخل الفكرة أو السيناريو، وسيحوّله التطبيق إلى مشاهد ولقطات، مع أوامر جاهزة لأدوات توليد الفيديو.</p>

<div class="row">
  <div><label>النوع</label><select id="kind"><option value="film">فيلم</option><option value="series">مسلسل</option></select></div>
  <div><label>الأسلوب البصري</label>
    <select id="style">
      <option value="cinematic, dramatic lighting">سينمائي درامي</option>
      <option value="anime style">أنمي</option>
      <option value="documentary, handheld camera">وثائقي</option>
      <option value="noir, black and white">نوار بالأبيض والأسود</option>
      <option value="3D animation, Pixar style">رسوم ثلاثية الأبعاد</option>
    </select>
  </div>
</div>

<label>عنوان العمل</label>
<input id="title" placeholder="مثال: الرسالة الأخيرة">

<label>الفكرة (اختياري)</label>
<textarea id="idea" placeholder="ملخص قصير للفكرة..."></textarea>

<label>السيناريو (اختياري)</label>
<textarea id="script" style="min-height:200px" placeholder="مشهد 1: داخلي - مكتب ليلاً&#10;أحمد: لم يعد هناك وقت.&#10;سارة: سأنتظرك في الخارج."></textarea>

<button id="go">حوّل إلى خطة إنتاج</button>
<div id="out"></div>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SHOT_TYPES = ['establishing wide shot','medium shot','close-up','over-the-shoulder shot','medium close-up','close-up'];
let project = null;

function parseScenes(text){
  const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
  const head = /^(مشهد\s*\d*|SCENE\s*\d*|INT\.|EXT\.|داخلي|خارجي)/i;
  const scenes = [];
  let cur = null;
  for (const l of lines){
    if (head.test(l)){ cur = {title:l, lines:[]}; scenes.push(cur); }
    else {
      if (!cur){ cur = {title:'مشهد 1', lines:[]}; scenes.push(cur); }
      cur.lines.push(l);
    }
  }
  return scenes;
}

function ideaToScenes(idea){
  return idea.split(/[.\n؟!،]+/).map(s => s.trim()).filter(s => s.length > 3)
    .map((s,i) => ({title:'مشهد ' + (i+1), lines:[s]}));
}

function buildShots(scene, style){
  const dialog = scene.lines.map(l => {
    const m = l.match(/^([^:：]{1,25})[:：]\s*(.+)/);
    return m ? {speaker:m[1].trim(), text:m[2].trim()} : {speaker:null, text:l};
  });
  const picks = dialog.slice(0, 5);
  const shots = [{type:SHOT_TYPES[0], subject:scene.title, text:'', speaker:null}];
  picks.forEach((d,i) => shots.push({type:SHOT_TYPES[(i+1) % SHOT_TYPES.length], subject:d.speaker || 'action', text:d.text, speaker:d.speaker}));
  return shots.map(s => ({
    ...s,
    duration: 4,
    prompt: `${s.type}, ${scene.title}, ${s.speaker ? s.speaker + ' says: "' + s.text + '"' : s.text || 'establishing the location'}, ${style}, consistent characters, 4 seconds`
  }));
}

function analyze(){
  const kind = $('#kind').value;
  const style = $('#style').value;
  const title = $('#title').value.trim() || 'عمل بدون عنوان';
  const script = $('#script').value.trim();
  const idea = $('#idea').value.trim();
  if (!script && !idea){ alert('أدخل فكرة أو سيناريو أولاً'); return; }

  let scenes = script ? parseScenes(script) : ideaToScenes(idea);
  const chars = new Set();
  scenes.forEach(sc => sc.lines.forEach(l => {
    const m = l.match(/^([^:：]{1,25})[:：]/);
    if (m) chars.add(m[1].trim());
  }));

  const size = kind === 'series' ? 4 : scenes.length;
  const episodes = [];
  for (let i = 0; i < scenes.length; i += size){
    episodes.push({
      name: kind === 'series' ? 'الحلقة ' + (episodes.length + 1) : title,
      scenes: scenes.slice(i, i + size).map(sc => ({title: sc.title, shots: buildShots(sc, style)}))
    });
  }
  const shotCount = episodes.reduce((n,e) => n + e.scenes.reduce((m,s) => m + s.shots.length, 0), 0);
  project = {title, kind, style, characters:[...chars], episodes, shotCount};
  render();
}

function render(){
  const p = project;
  const total = p.shotCount * 4;
  let html = `<h2>${esc(p.title)}</h2>
  <div class="stats">
    <div><b>${p.episodes.length}</b>${p.kind === 'series' ? 'حلقة' : 'جزء'}</div>
    <div><b>${p.episodes.reduce((n,e)=>n+e.scenes.length,0)}</b>مشهد</div>
    <div><b>${p.shotCount}</b>لقطة</div>
    <div><b>${Math.round(total/60*10)/10}</b>دقيقة تقريبية</div>
  </div>
  <div class="card"><h3>الشخصيات</h3>${p.characters.length ? p.characters.map(c => `<span class="tag">${esc(c)}</span>`).join('') : '<span class="muted">لم تُكتشف شخصيات. أضف أسماء قبل النقطتين في السيناريو مثل: أحمد: ...</span>'}</div>
  <button class="ghost" id="copyAll">نسخ كل الأوامر</button>
  <button class="ghost" id="copyJson">نسخ الخطة JSON</button>
  <button class="ghost" id="exportBtn">تصدير للصق في أداة الفيديو</button>
  <div id="exp"></div>`;

  p.episodes.forEach(ep => {
    html += `<h2>${esc(ep.name)}</h2>`;
    ep.scenes.forEach(sc => {
      html += `<div class="card"><h3>${esc(sc.title)}</h3>`;
      sc.shots.forEach((s,i) => {
        html += `<div class="shot"><span class="tag">لقطة ${i+1}</span><span class="tag">${esc(s.type)}</span>
          ${s.speaker ? `<div><b>${esc(s.speaker)}:</b> ${esc(s.text)}</div>` : (s.text ? `<div>${esc(s.text)}</div>` : '')}
          <pre>${esc(s.prompt)}</pre></div>`;
      });
      html += `</div>`;
    });
  });
  $('#out').innerHTML = html;
  $('#copyAll').onclick = () => copy(allPrompts());
  $('#copyJson').onclick = () => copy(JSON.stringify(p, null, 2));
  $('#exportBtn').onclick = showExport;
  $('#out').scrollIntoView({behavior:'smooth'});
}

function allPrompts(){
  return project.episodes.flatMap(e => e.scenes.flatMap(s => s.shots.map(x => x.prompt))).join('\n');
}

function showExport(){
  let n = 0;
  const text = project.episodes.map(e => {
    const scenes = e.scenes.map(s => {
      const shots = s.shots.map(x => `${++n}. ${x.prompt}`).join('\n');
      return `# ${s.title}\n${shots}`;
    }).join('\n\n');
    return `## ${e.name}\n\n${scenes}`;
  }).join('\n\n');
  $('#exp').innerHTML = `<div class="card"><h3>الأوامر جاهزة للصق</h3>
    <p class="muted">انسخ كل لقطة على حدة إلى أداة الفيديو، وكرر الشخصيات والأسلوب نفسه في كل لقطة.</p>
    <textarea style="min-height:260px;direction:ltr;text-align:left;font-size:.85rem">${esc(text)}</textarea>
    <button class="ghost" id="copyExp">نسخ النص</button></div>`;
  $('#copyExp').onclick = () => copy(text);
}

async function copy(text){
  try { await navigator.clipboard.writeText(text); alert('تم النسخ'); }
  catch(e){ alert('تعذّر النسخ تلقائياً، انسخ النص يدوياً.'); }
}

$('#go').addEventListener('click', analyze);
</script>
</body>
</html>
